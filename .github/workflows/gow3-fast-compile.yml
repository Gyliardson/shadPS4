name: GOW3 Fast Windows Compile

on:
  push:
    branches:
      - gow3-intel-b580-predication
    paths-ignore:
      - .github/gow3-diagnostic-trigger
      - documents/**
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: gow3-fast-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  windows-fast:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Restore rolling compilation cache
        uses: hendrikmuhs/ccache-action@v1.2.21
        with:
          key: gow3-b580-fast-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          append-timestamp: true
          max-size: 2G
          verbose: 1

      - name: Configure fast CMake build
        run: >-
          cmake --fresh -G Ninja
          -B ${{ github.workspace }}/build-fast
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=OFF
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Compile shadPS4 target
        run: cmake --build ${{ github.workspace }}/build-fast --target shadps4 --config ${{ env.BUILD_TYPE }} --parallel $env:NUMBER_OF_PROCESSORS
