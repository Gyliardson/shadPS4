name: GOW3 Readback Benchmark Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - gow3-intel-b580-predication
      - gow3-intel-b580-pcache
    paths:
      - .github/workflows/gow3-benchmark-readback.yml
      - .github/patches/gow3-benchmark-readback.patch
      - .github/patches/gow3-benchmark-control.patch
      - .github/patches/gow3-batched-linear-readback.patch
      - .github/patches/gow3-batched-linear-readback-instrumentation.patch
      - .github/gow3-benchmark/**

concurrency:
  group: gow3-readback-benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  windows-benchmark:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Apply and validate benchmark-only instrumentation
        shell: pwsh
        run: |
          # Behavior experiment first: preserve synchronous correctness while batching all
          # pending linear-image copies behind one scheduler.Finish().
          git apply --recount --check .github/patches/gow3-batched-linear-readback.patch
          git apply --recount .github/patches/gow3-batched-linear-readback.patch

          # Diagnostic instrumentation is layered on top of the behavior patch.
          git apply --recount --check .github/patches/gow3-benchmark-readback.patch
          git apply --recount .github/patches/gow3-benchmark-readback.patch
          git apply --recount --check .github/patches/gow3-benchmark-control.patch
          git apply --recount .github/patches/gow3-benchmark-control.patch
          git apply --recount --check .github/patches/gow3-batched-linear-readback-instrumentation.patch
          git apply --recount .github/patches/gow3-batched-linear-readback-instrumentation.patch
          git diff --check

          $sourceChecks = @(
            @{ Path = 'src/common/perf_trace.h'; Marker = 'image_readback_finish_total_ms' },
            @{ Path = 'src/sdl_window.cpp'; Marker = 'GOW3_BENCHMARK_INSTRUMENTATION_V2' },
            @{ Path = 'src/sdl_window.cpp'; Marker = 'SDL_GAMEPAD_BUTTON_GUIDE' },
            @{ Path = 'src/video_core/texture_cache/texture_cache.cpp'; Marker = 'GOW3_BATCHED_LINEAR_READBACK_V1' },
            @{ Path = 'src/video_core/texture_cache/texture_cache.cpp'; Marker = 'total_download_size' }
          )
          foreach ($check in $sourceChecks) {
            $text = Get-Content -LiteralPath $check.Path -Raw
            if (-not $text.Contains($check.Marker)) {
              throw "Benchmark source validation failed: '$($check.Marker)' missing from $($check.Path)"
            }
          }
          Write-Host 'Benchmark source instrumentation validated.'

      # Deliberately no compiler cache in this diagnostic workflow. Binary identity takes
      # priority over compile time for the benchmark artifact.
      - name: Configure CMake
        run: >-
          cmake --fresh -G Ninja
          -B ${{ github.workspace }}/build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl

      - name: Build shadPS4 target
        run: cmake --build ${{ github.workspace }}/build --target shadps4 --config ${{ env.BUILD_TYPE }} --parallel $env:NUMBER_OF_PROCESSORS

      - name: Validate benchmark executable
        shell: pwsh
        run: |
          $exe = "${{ github.workspace }}/build/shadPS4.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Built executable missing: $exe"
          }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          $markers = @(
            'GOW3_BENCHMARK_INSTRUMENTATION_V2',
            'GOW3 BENCHMARK CAPTURE',
            'image_readback_finish_total_ms',
            'GOW3_BATCHED_LINEAR_READBACK_V1'
          )
          foreach ($marker in $markers) {
            if (-not $ascii.Contains($marker)) {
              throw "INVALID BENCHMARK EXECUTABLE: compiled marker missing: $marker"
            }
          }
          Write-Host 'Compiled benchmark markers validated in shadPS4.exe.'

      - name: Package and revalidate benchmark build
        shell: pwsh
        run: |
          $artifact = "${{ github.workspace }}/artifact"
          $sourceExe = "${{ github.workspace }}/build/shadPS4.exe"
          $artifactExe = "$artifact/shadPS4-gow3-b580-benchmark.exe"
          New-Item -ItemType Directory -Force -Path $artifact | Out-Null
          Copy-Item $sourceExe $artifactExe
          Copy-Item "${{ github.workspace }}/.github/gow3-benchmark/*" $artifact -Force

          $bytes = [System.IO.File]::ReadAllBytes($artifactExe)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          foreach ($marker in @('GOW3_BENCHMARK_INSTRUMENTATION_V2', 'GOW3 BENCHMARK CAPTURE', 'image_readback_finish_total_ms', 'GOW3_BATCHED_LINEAR_READBACK_V1')) {
            if (-not $ascii.Contains($marker)) {
              throw "INVALID PACKAGED BENCHMARK EXECUTABLE: marker missing after copy: $marker"
            }
          }

          $exeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifactExe).Hash.ToLowerInvariant()
          $readbackPatchHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "${{ github.workspace }}/.github/patches/gow3-benchmark-readback.patch").Hash.ToLowerInvariant()
          $controlPatchHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "${{ github.workspace }}/.github/patches/gow3-benchmark-control.patch").Hash.ToLowerInvariant()
          $batchPatchHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "${{ github.workspace }}/.github/patches/gow3-batched-linear-readback.patch").Hash.ToLowerInvariant()
          $batchInstrumentationHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "${{ github.workspace }}/.github/patches/gow3-batched-linear-readback-instrumentation.patch").Hash.ToLowerInvariant()

          @"
          GOW3 Intel B580 benchmark artifact
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Instrumentation: GOW3_BENCHMARK_INSTRUMENTATION_V2
          Behavior experiment: GOW3_BATCHED_LINEAR_READBACK_V1
          Readback patch SHA256: $readbackPatchHash
          Control patch SHA256: $controlPatchHash
          Batched readback patch SHA256: $batchPatchHash
          Batched instrumentation patch SHA256: $batchInstrumentationHash
          Executable SHA256: $exeHash
          Binary marker validation: PASS
          Compiler cache: DISABLED
          "@ | Set-Content -Encoding utf8NoBOM "$artifact/BENCHMARK-BUILD-INFO.txt"

          Write-Host "Packaged executable SHA256: $exeHash"
          Write-Host 'Packaged benchmark markers validated.'

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v7
        with:
          name: shadps4-gow3-benchmark-${{ github.ref_name }}-${{ github.sha }}
          path: ${{ github.workspace }}/artifact/
          retention-days: 14
